name: Publish pyosys

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      PYTHON_VERSION: "3.11"
      CCACHE_DIR: /project/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang bison flex libfl-dev libreadline-dev gawk tcl-dev libffi-dev ccache \
            git mercurial graphviz xdot pkg-config python3-dev cmake
          python -m pip install --upgrade pip
          python -m pip install build pybind11 cibuildwheel

      - name: Build sdist
        run: python -m build --sdist

      - name: Build manylinux wheel
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ENVIRONMENT: >-
            CC="ccache gcc"
            CXX="ccache g++"
            CCACHE_DIR=/project/.ccache
            CCACHE_BASEDIR=/project
            CCACHE_NOHASHDIR=true
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y
            bison flex tcl-devel readline-devel libffi-devel
            gcc gcc-c++ make cmake git mercurial ccache
        run: python -m cibuildwheel --output-dir dist

      - name: ccache stats
        env:
          CCACHE_DIR: .ccache
        run: ccache -s

      - name: Save ccache
        if: always() && steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
