name: Publish pyosys

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PYTHON_VERSION: "3.11"
      CC: "ccache gcc"
      CXX: "ccache g++"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-
          save-always: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang bison flex libfl-dev libreadline-dev gawk tcl-dev libffi-dev ccache \
            git mercurial graphviz xdot pkg-config python3-dev cmake
          python -m pip install --upgrade pip
          python -m pip install build twine pybind11

      - name: Build wheel
        run: python -m build --wheel

      - name: ccache stats
        run: ccache -s

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TWINE_REPOSITORY_URL: https://upload.pypi.pkg.github.com/${{ github.repository_owner }}/
        run: |
          python -m twine upload \
            --repository-url "$TWINE_REPOSITORY_URL" \
            dist/*
